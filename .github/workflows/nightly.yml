# Slower checks that don't block merges: mutation testing and a fresh image CVE scan of main.
# Failures show up as a red run on main and a GitHub notification.

name: Nightly

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: temurin
  IMAGE: invoice-intel:nightly

jobs:
  detect:
    name: Detect project state
    runs-on: ubuntu-latest
    outputs:
      has_build: ${{ steps.check.outputs.has_build }}
      has_dockerfile: ${{ steps.check.outputs.has_dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          has() { [ -e "$1" ] && echo true || echo false; }
          echo "has_build=$(has settings.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "has_dockerfile=$(has Dockerfile)" >> "$GITHUB_OUTPUT"

  mutation-tests:
    name: Mutation tests (PIT)
    needs: detect
    if: needs.detect.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run PIT on pii and validate modules
        run: ./gradlew :pii:pitest :validate:pitest --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: "**/build/reports/pitest/"
          retention-days: 30

  image-rescan:
    name: Image CVE rescan
    needs: detect
    if: needs.detect.outputs.has_dockerfile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull -t "$IMAGE" .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-image.sarif
          trivyignores: .trivyignore
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
