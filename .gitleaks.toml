# Secret scan config for CI (repo-guards job). Extends the default gitleaks rules with
# Indian personal identifiers, so real PII in code or docs is caught as well as secrets.

title = "invoice-intel"

[extend]
useDefault = true

[[rules]]
id = "india-pan"
description = "Indian PAN (Permanent Account Number)"
regex = '''\b[A-Z]{3}[ABCFGHJLPT][A-Z][0-9]{4}[A-Z]\b'''

[[rules]]
id = "india-aadhaar-formatted"
description = "Aadhaar number written in 4-4-4 groups"
regex = '''\b[2-9][0-9]{3}[ -][0-9]{4}[ -][0-9]{4}\b'''

[[rules]]
id = "india-mobile"
description = "Indian mobile number with country code"
regex = '''(?:\+91|\b91)[ -]?[6-9][0-9]{9}\b'''

# Synthetic fixtures and irreversibly redacted samples contain fake, valid-format identifiers.
[[allowlists]]
description = "Synthetic fixtures and redacted samples"
paths = [
  '''(^|/)src/(test|integrationTest)/resources/fixtures/''',
  '''^data/samples-redacted/''',
]
