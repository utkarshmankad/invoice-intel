# `test`: Postgres from Testcontainers via @ServiceConnection, which replaces the datasource
# settings (architecture.md §10). No network LLM calls.
spring:
  main:
    banner-mode: off

# Stage jobs only run in tests that enable the server (PipelineIT), so upload tests see the
# documents they create in RECEIVED.
jobrunr:
  background-job-server:
    enabled: false
