# Shared settings for every profile (architecture.md §10). Environment-specific values come
# from environment variables (NFR-12, deployment.md §5.1); defaults point at the local
# compose stack and are never secrets.
spring:
  application:
    name: invoice-intel
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/invoice_intel}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  # Phone photos of invoices exceed Spring's 1 MB default (ING-1); larger requests get 413.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

invoice-intel:
  # Single admin user (NFR-2, architecture.md §11). No default password: start-up fails
  # until APP_ADMIN_PASSWORD is set.
  security:
    admin-username: ${APP_ADMIN_USER:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
  storage:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    bucket-raw: ${S3_BUCKET_RAW:raw}
    bucket-redacted: ${S3_BUCKET_REDACTED:redacted}
    # No defaults: start-up fails until both are set.
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  text:
    dpi: 300
    ocr-languages: [eng]
    max-concurrent-page-jobs: 2

# Stage jobs (architecture.md §5, ADR-04). JobRunr uses the app's datasource and creates its
# own tables. The dashboard stays off: it would listen on its own port without the app's login.
jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: false
  miscellaneous:
    # JobRunr reports anonymous usage data unless told not to; this app sends nothing out.
    allow-anonymous-data-usage: false

# JSON log lines (ECS) with MDC fields such as documentId and stage (NFR-6). The customizer
# masks PII-shaped strings in every value as a backstop (PII-8, architecture.md §11).
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: dev.invoiceintel.app.logging.PiiMaskingJsonMembersCustomizer

# Only health is exposed over HTTP; details stay hidden (PII-8, NFR-2).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
