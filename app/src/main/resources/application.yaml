# Shared settings for every profile (architecture.md §10). Environment-specific values come
# from environment variables (NFR-12, deployment.md §5.1); defaults point at the local
# compose stack and are never secrets.
spring:
  application:
    name: invoice-intel
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/invoice_intel}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration

invoice-intel:
  # Single admin user (NFR-2, architecture.md §11). No default password: start-up fails
  # until APP_ADMIN_PASSWORD is set.
  security:
    admin-username: ${APP_ADMIN_USER:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
  storage:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    bucket-raw: ${S3_BUCKET_RAW:raw}
    bucket-redacted: ${S3_BUCKET_REDACTED:redacted}
  text:
    dpi: 300
    ocr-languages: [eng]
    max-concurrent-page-jobs: 2

# JSON log lines (ECS) with MDC fields such as documentId and stage (NFR-6). The customizer
# masks PII-shaped strings in every value as a backstop (PII-8, architecture.md §11).
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: dev.invoiceintel.app.logging.PiiMaskingJsonMembersCustomizer

# Only health is exposed over HTTP; details stay hidden (PII-8, NFR-2).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
