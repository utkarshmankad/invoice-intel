# Shared settings for every profile (architecture.md §10). Environment-specific values come
# from environment variables (NFR-12, deployment.md §5.1); defaults point at the local
# compose stack and are never secrets.
spring:
  application:
    name: invoice-intel
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/invoice_intel}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  # Phone photos of invoices exceed Spring's 1 MB default (ING-1); larger requests get 413.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

invoice-intel:
  # Single admin user (NFR-2, architecture.md §11). No default password: start-up fails
  # until APP_ADMIN_PASSWORD is set.
  security:
    admin-username: ${APP_ADMIN_USER:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
  storage:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    bucket-raw: ${S3_BUCKET_RAW:raw}
    bucket-redacted: ${S3_BUCKET_REDACTED:redacted}
    # No defaults: start-up fails until both are set.
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  text:
    dpi: 300
    ocr-languages: [eng]
    # Debian/Ubuntu tesseract-ocr package, as in the container image (Dockerfile).
    tessdata-path: ${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
    min-text-chars: 20
    max-concurrent-page-jobs: 2
  # PII stage (PII-2, PII-3, architecture.md §6.3). Each detection layer can be switched off
  # for evaluation, but at least one of rules, address-block and ner must stay on. The local
  # LLM layer is a stub, off by default, and only accepts a loopback endpoint.
  pii:
    mode: ${PII_MODE:pseudonymize}
    detectors:
      rules: true
      address-block: true
      ner: true
      local-llm: false
    ner:
      # Pinned model snapshot (ADR-15); set when the PII stage loads NER (M2.10).
      model-dir: ${NER_MODEL_DIR:}
      threshold: 0.5
    local-llm:
      endpoint: http://127.0.0.1:11434
  # Extract stage (EXT-1..5, architecture.md §6.5, ADR-18). It runs only when
  # LLM_EXTRACTION_MODEL names a model below; blank keeps documents in PII_CLEAN. Prices are USD
  # per million tokens (EXT-4), Anthropic list prices checked 2026-10-30.
  llm:
    extraction:
      model: ${LLM_EXTRACTION_MODEL:}
      strategy: ${LLM_EXTRACTION_STRATEGY:text}
    models:
      - name: claude-sonnet
        provider: anthropic
        model-id: ${LLM_ANTHROPIC_MODEL_ID:claude-sonnet-5-5}
        capabilities: [text, vision]
        input-price-per-million: 2.00
        output-price-per-million: 10.00
      - name: local
        provider: ollama
        model-id: ${LLM_OLLAMA_MODEL_ID:qwen2.5vl:7b}
        capabilities: [text, vision]
        input-price-per-million: 0
        output-price-per-million: 0
    ollama:
      base-url: ${LLM_OLLAMA_BASE_URL:http://127.0.0.1:11434}
    # No default key: an Anthropic model can only be chosen once LLM_ANTHROPIC_API_KEY is set.
    anthropic:
      api-key: ${LLM_ANTHROPIC_API_KEY:}
  # Validate stage (VAL-8, architecture.md §6.6): the auto-approval threshold, tuned from eval
  # runs to keep false auto-approvals at or below 2% (spec §9).
  validate:
    approve-threshold: ${VALIDATE_APPROVE_THRESHOLD:0.85}
  # Order-history import (REC-1, architecture.md §6.7): the column mapping, read on every import.
  # Relative to the working directory (the repository root for bootRun).
  order-history:
    mapping-file: ${ORDER_HISTORY_MAPPING_FILE:config/order-history-mapping.yml}

# Stage jobs (architecture.md §5, ADR-04). JobRunr uses the app's datasource and creates its
# own tables. The dashboard stays off: it would listen on its own port without the app's login.
jobrunr:
  background-job-server:
    enabled: true
    # How often the server looks for enqueued jobs. Every upload waits for the next poll before
    # its Text stage starts, so this counts toward the time to decision (NFR-3); 5 s is JobRunr's
    # smallest allowed value for SQL storage (plan M4.12). Default 15 s.
    poll-interval-in-seconds: 5
  dashboard:
    enabled: false
  miscellaneous:
    # JobRunr reports anonymous usage data unless told not to; this app sends nothing out.
    allow-anonymous-data-usage: false

# JSON log lines (ECS) with MDC fields such as documentId and stage (NFR-6). The customizer
# masks PII-shaped strings in every value as a backstop (PII-8, architecture.md §11).
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: dev.invoiceintel.app.logging.PiiMaskingJsonMembersCustomizer

# Health is public with details hidden (PII-8, NFR-2). Metrics (architecture.md §12, NFR-6) need
# the admin login like every other page; their tags carry codes and names only, never values.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
