# Load profiles and performance gates (docs/ci.md §5), read by the simulations. Tightening is
# free; loosening needs a note in the PR description. Simple `key = value` lines only.

# Load per profile (-Dperf.profile, default local)
ci.users = 10
ci.duration-seconds = 60
ci.pipeline-documents = 20
ci.pipeline-ramp-seconds = 20
local.users = 2
local.duration-seconds = 15
local.pipeline-documents = 5
local.pipeline-ramp-seconds = 5

# Health and authentication (M0.15)
health-auth.p95-ms = 500
health-auth.max-error-percent = 1

# Upload and read API (M4.10)
upload-read.p95-ms = 500
upload-read.max-error-percent = 1

# End-to-end time to decision, digital PDF (M4.10, NFR-3): p95 limit, and how long one document
# may be polled before it counts as never decided
pipeline.decision-p95-ms = 20000
pipeline.timeout-seconds = 60

# Review queue and list endpoints (M4.10)
lists.p95-ms = 300
lists.max-error-percent = 1
